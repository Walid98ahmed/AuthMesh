version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: praxion-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-praxion}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-praxion}']
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    env_file:
      - services/user-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3002:3002'

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    env_file:
      - services/auth-service/.env
    depends_on:
      - user-service
    ports:
      - '3001:3001'

volumes:
  postgres_data:
